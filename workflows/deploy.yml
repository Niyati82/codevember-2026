
name: Deploy Codevember

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all days
        run: |
          mkdir -p site

          for dir in day-*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Building $dir"

              cd "$dir"
              npm ci
              npm run build

              day=$(basename "$dir")
              mkdir -p "../site/$day"
              cp -r dist/. "../site/$day/"

              cd ..
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
